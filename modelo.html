<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#020713">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelo 3D · Esferoide HT22</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body class="visor">
<header class="top">
  <a class="volver" href="./">‹ inicio</a>
  <nav class="pestanas" aria-label="Aumento">
    <a data-v="40x" href="?v=40x">40x</a>
    <a data-v="10x" href="?v=10x">10x</a>
  </nav>
</header>

<div class="cuerpo sin-panel" id="cuerpo">
  <div class="vista">
    <div id="lienzo"></div>
    <span class="esq a" id="esq-a"></span><span class="esq b">arrastrá para girar</span><span class="esq d" id="medidas"></span>
    <div class="plegado" id="plegado">
      <span class="chips"><span class="t-wga" data-chip="wga">WGA</span><span class="t-gfp" data-chip="gfp">GFP</span><span class="t-dapi" data-chip="dapi">DAPI</span></span>
      <button class="btn btn--chico" id="mostrar" type="button">[ controles ]</button>
    </div>
    <div id="cargando" role="status" aria-live="polite">
      <p><span class="pr">unsam@biocel</span>:<span class="gr">~/grupo8</span>$ ver modelo --<span id="cmd-v"></span></p>
      <div id="log"></div>
      <p class="progreso" id="barra-carga">[----------------------]    0 %</p>
      <p class="dim" id="pista">con datos móviles puede tardar unos segundos</p>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="Controles">
    <h2>Canales</h2>
    <div class="canal" data-c="wga">
      <label class="check"><input type="checkbox" checked><span class="caja-x">[x]</span><b class="nombre t-wga">WGA</b></label>
      <span class="nota">membranas</span>
      <input type="range" min="0.2" max="4" step="0.05" value="1" aria-label="Brillo WGA">
    </div>
    <div class="canal" data-c="gfp">
      <label class="check"><input type="checkbox" checked><span class="caja-x">[x]</span><b class="nombre t-gfp">M6a-GFP</b></label>
      <span class="nota">transfectadas</span>
      <input type="range" min="0.2" max="4" step="0.05" value="1.2" aria-label="Brillo GFP">
    </div>
    <div class="canal" data-c="dapi">
      <label class="check"><input type="checkbox"><span class="caja-x">[ ]</span><b class="nombre t-dapi">DAPI</b></label>
      <span class="nota">núcleos</span>
      <input type="range" min="0.2" max="4" step="0.05" value="1" aria-label="Brillo DAPI">
    </div>
    <h2>Vista</h2>
    <div class="ops" role="radiogroup" aria-label="Modo">
      <label class="check"><input type="radio" name="modo" value="0" checked><span class="caja-x">(•)</span>máxima intensidad</label>
      <label class="check"><input type="radio" name="modo" value="1"><span class="caja-x">( )</span>translúcido</label>
    </div>
    <div class="ops">
      <label class="check"><input type="checkbox" id="girar" checked><span class="caja-x">[x]</span>girar solo</label>
      <label class="check"><input type="checkbox" id="caja"><span class="caja-x">[ ]</span>caja</label>
    </div>
    <div class="pie">
      <button class="btn btn--chico" id="reset" type="button">[ vista inicial ]</button>
      <button class="btn btn--chico" id="ocultar" type="button">[ ocultar ]</button>
    </div>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const vid = params.get('v') === '10x' ? '10x' : '40x';
document.querySelectorAll('.pestanas a').forEach(a => { if (a.dataset.v === vid) a.setAttribute('aria-current', 'page'); });
document.getElementById('cmd-v').textContent = vid;
document.getElementById('esq-a').textContent = vid;

const info = (await (await fetch('data/volumenes.json')).json())[vid];
const [nx, ny, nz] = info.dims;
const fis = [nx * info.um_px, ny * info.um_px, nz * info.um_z];
document.getElementById('medidas').textContent = `${fis[0].toFixed(0)} × ${fis[1].toFixed(0)} × ${fis[2].toFixed(0)} µm · ${nz} planos cada ${info.um_z} µm`;
document.title = `Modelo 3D ${vid} · Esferoide HT22`;

// --- descarga y descompresión de los tres canales, con progreso real en bytes ---
const log = document.getElementById('log'), barraCarga = document.getElementById('barra-carga');
const ANCHO = 22;
function pintarBarra(f) {
  f = Math.min(1, Math.max(0, f));
  const n = Math.round(f * ANCHO);
  barraCarga.textContent = '[' + '#'.repeat(n) + '-'.repeat(ANCHO - n) + ']  ' + String(Math.floor(f * 100)).padStart(3) + ' %';
}
async function bajar(url, alAvanzar) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !r.body.getReader) { const b = await r.arrayBuffer(); alAvanzar(b.byteLength, b.byteLength); return b; }
  const lector = r.body.getReader(), partes = [];
  let recibidos = 0;
  for (;;) {
    const { done, value } = await lector.read();
    if (done) break;
    partes.push(value); recibidos += value.length;
    alAvanzar(recibidos, total);
  }
  const todo = new Uint8Array(recibidos);
  let o = 0; for (const p of partes) { todo.set(p, o); o += p.length; }
  return todo.buffer;
}
async function gunzip(buf) {
  if ('DecompressionStream' in window) {
    const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  const { gunzipSync } = await import('https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js');
  return gunzipSync(new Uint8Array(buf));
}
const orden = ['wga', 'gfp', 'dapi'];  // R, G, B de la textura
const estado = {};
for (const c of orden) {
  log.insertAdjacentHTML('beforeend', `<p><span class="dim">bajando</span> ${info.canales[c].padEnd(16)} <span id="st-${c}" class="dim">…</span></p>`);
  estado[c] = { rec: 0, total: 0 };
}
function avance() {
  const vals = Object.values(estado);
  if (vals.some(v => !v.total)) {  // sin tamaño todavía: cuenta por archivo terminado
    pintarBarra(vals.filter(v => v.listo).length / vals.length); return;
  }
  pintarBarra(vals.reduce((s, v) => s + v.rec, 0) / vals.reduce((s, v) => s + v.total, 0));
}
let canales;
try {
  canales = await Promise.all(orden.map(async c => {
    const st = document.getElementById('st-' + c);
    const buf = await bajar('data/' + info.canales[c], (rec, total) => {
      estado[c].rec = rec; estado[c].total = total;
      if (total) st.textContent = Math.floor(rec / total * 100) + ' %';
      avance();
    });
    estado[c].listo = true; estado[c].rec = estado[c].total = estado[c].total || buf.byteLength;
    st.textContent = 'listo'; st.className = 'ok';
    avance();
    return gunzip(buf);
  }));
} catch (e) {
  log.insertAdjacentHTML('beforeend', `<p class="error">no se pudo bajar el modelo (${e.message}). Revisá la conexión y recargá la página.</p>`);
  throw e;
}
pintarBarra(1);
log.insertAdjacentHTML('beforeend', `<p class="dim">armando volumen ${nx} × ${ny} × ${nz} planos</p>`);
await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
const n = nx * ny * nz;
const rgba = new Uint8Array(n * 4);
for (let i = 0; i < n; i++) {
  rgba[4 * i] = canales[0][i]; rgba[4 * i + 1] = canales[1][i]; rgba[4 * i + 2] = canales[2][i]; rgba[4 * i + 3] = 255;
}
const tex = new THREE.Data3DTexture(rgba, nx, ny, nz);
tex.format = THREE.RGBAFormat;
tex.minFilter = tex.magFilter = THREE.LinearFilter;
tex.unpackAlignment = 1;
tex.needsUpdate = true;

// --- escena ---
const cont = document.getElementById('lienzo');
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000);
cont.appendChild(renderer.domElement);
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controles = new OrbitControls(camara, renderer.domElement);
controles.enableDamping = true;
controles.autoRotateSpeed = 1.5;
controles.autoRotate = true;

const m = Math.max(...fis);
const escala = new THREE.Vector3(fis[0] / m, fis[1] / m, fis[2] / m);

const vert = /* glsl */`
  out vec3 vOrigen; out vec3 vDir;
  void main() {
    vOrigen = (inverse(modelMatrix) * vec4(cameraPosition, 1.0)).xyz;
    vDir = position - vOrigen;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
const frag = /* glsl */`
  precision highp float; precision highp sampler3D;
  in vec3 vOrigen; in vec3 vDir; out vec4 color;
  uniform sampler3D uVol; uniform vec3 uGanancia; uniform vec3 uVisible; uniform int uModo; uniform float uPasos;
  const vec3 ROJO = vec3(1.0, 0.12, 0.12), VERDE = vec3(0.15, 1.0, 0.2), AZUL = vec3(0.25, 0.45, 1.0);
  vec2 cortarCaja(vec3 o, vec3 d) {
    vec3 inv = 1.0 / d;
    vec3 t0 = (vec3(-0.5) - o) * inv, t1 = (vec3(0.5) - o) * inv;
    vec3 tmin = min(t0, t1), tmax = max(t0, t1);
    return vec2(max(max(tmin.x, tmin.y), tmin.z), min(min(tmax.x, tmax.y), tmax.z));
  }
  vec3 colorDe(vec3 v) { v *= uGanancia * uVisible; return v.r * ROJO + v.g * VERDE + v.b * AZUL; }
  void main() {
    vec3 d = normalize(vDir);
    vec2 t = cortarCaja(vOrigen, d);
    if (t.x > t.y) discard;
    t.x = max(t.x, 0.0);
    float paso = 1.7320508 / uPasos;
    vec3 maximo = vec3(0.0); vec4 acum = vec4(0.0);
    for (float s = t.x; s < t.y; s += paso) {
      vec3 v = texture(uVol, vOrigen + d * s + 0.5).rgb;
      if (uModo == 0) { maximo = max(maximo, v); }
      else {
        vec3 c = colorDe(v);
        float a = clamp(max(c.r, max(c.g, c.b)) * 0.06, 0.0, 1.0);
        acum.rgb += (1.0 - acum.a) * a * c / max(a, 1e-4) * a;
        acum.a += (1.0 - acum.a) * a;
        if (acum.a > 0.97) break;
      }
    }
    vec3 c = uModo == 0 ? colorDe(maximo) : acum.rgb * 2.2;
    color = vec4(pow(clamp(c, 0.0, 1.0), vec3(0.9)), 1.0);
  }`;
const uniforms = {
  uVol: { value: tex },
  uGanancia: { value: new THREE.Vector3(1, 1.2, 1) },
  uVisible: { value: new THREE.Vector3(1, 1, 0) },
  uModo: { value: 0 },
  uPasos: { value: Math.max(nx, ny, nz) * 1.2 },
};
const material = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3, uniforms, vertexShader: vert, fragmentShader: frag, side: THREE.BackSide,
});
const cubo = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);
const grupo = new THREE.Group();
grupo.add(cubo);
const caja = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
  new THREE.LineBasicMaterial({ color: 0x5b6478, transparent: true, opacity: 0.6 }));
grupo.add(caja);
// Las imágenes tienen y hacia abajo y el plano 1 es el más cercano al objetivo: se ven como en Fiji.
grupo.scale.set(escala.x, -escala.y, escala.z);
escena.add(grupo);

// Barra de escala de 50 µm sobre el borde inferior de la caja
const largo = 50 / m;
const barra = new THREE.Mesh(new THREE.BoxGeometry(largo, 0.006, 0.006), new THREE.MeshBasicMaterial({ color: 0xffffff }));
barra.position.set(escala.x / 2 - largo / 2 - 0.02, -escala.y / 2 - 0.03, escala.z / 2);
escena.add(barra);
caja.visible = false;

function vistaInicial() {
  // distancia para que el modelo entre entero también en pantallas angostas (celular)
  const d = 0.5 / Math.tan(THREE.MathUtils.degToRad(camara.fov / 2)) * Math.max(1, 1 / camara.aspect);
  // el 10x tiene poca resolución en z (planos cada 2 µm): arranca casi de frente, como en el microscopio
  const dir = vid === '10x' ? [-0.08, 0.12, -1.5] : [-0.3, 0.45, -1.5];  // desde el lado opuesto
  camara.position.set(...dir).normalize().multiplyScalar(d);
  camara.up.set(0, 1, 0);
  controles.target.set(0, 0, 0);
  controles.update();
}
function ajustar() {
  const w = cont.clientWidth, h = cont.clientHeight;
  renderer.setSize(w, h, false);
  camara.aspect = w / h;
  camara.updateProjectionMatrix();
}
new ResizeObserver(ajustar).observe(cont);
ajustar();
vistaInicial();

// --- controles de la interfaz ---
const indice = { wga: 0, gfp: 1, dapi: 2 };
const eje = ['x', 'y', 'z'];
// casillas estilo consola: [x] / [ ] y (•) / ( )
function marcar(inp) {
  document.querySelectorAll(`input[name="${inp.name}"]`).forEach(r => { if (r.type === 'radio') r.nextElementSibling.textContent = r.checked ? '(•)' : '( )'; });
  if (inp.type === 'checkbox') inp.nextElementSibling.textContent = inp.checked ? '[x]' : '[ ]';
}
document.querySelectorAll('.check input').forEach(inp => inp.addEventListener('change', () => marcar(inp)));
document.querySelectorAll('.canal').forEach(div => {
  const k = eje[indice[div.dataset.c]];
  const chk = div.querySelector('input[type=checkbox]'), rng = div.querySelector('input[type=range]');
  const chip = document.querySelector(`[data-chip="${div.dataset.c}"]`);
  const sync = () => {
    uniforms.uVisible.value[k] = chk.checked ? 1 : 0;
    uniforms.uGanancia.value[k] = parseFloat(rng.value);
    div.classList.toggle('apagado', !chk.checked);
    chip.classList.toggle('off', !chk.checked);
  };
  chk.addEventListener('change', sync); rng.addEventListener('input', sync); sync();
});
document.querySelectorAll('input[name="modo"]').forEach(r => r.addEventListener('change', () => { if (r.checked) uniforms.uModo.value = +r.value; }));
document.getElementById('caja').addEventListener('change', e => { caja.visible = e.target.checked; });
document.getElementById('girar').addEventListener('change', e => controles.autoRotate = e.target.checked);
document.getElementById('reset').addEventListener('click', vistaInicial);
const cuerpo = document.getElementById('cuerpo'), plegado = document.getElementById('plegado');
document.getElementById('ocultar').addEventListener('click', () => { cuerpo.classList.add('sin-panel'); plegado.hidden = false; });
document.getElementById('mostrar').addEventListener('click', () => { cuerpo.classList.remove('sin-panel'); plegado.hidden = true; });

document.getElementById('cargando').remove();
renderer.setAnimationLoop(() => { controles.update(); renderer.render(escena, camara); });
</script>
</body>
</html>
