<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrantes · Esferoides HT22 · Grupo 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main class="columna">
  <div class="top"><a class="volver" href="./">‹ inicio</a><span class="g8">GRUPO 8</span></div>
  <p class="linea"><span class="pr">unsam@biocel</span>:<span class="gr">~/grupo8</span>$ ls integrantes/</p>
  <div class="desplazable">
  <div class="gente" id="gente"></div>
  <p class="linea"><span class="pr">unsam@biocel</span>:<span class="gr">~/grupo8</span>$ cat datos.txt</p>
  <dl class="datos">
    <dt>grupo</dt><dd class="gr">Grupo 8 · turno tarde</dd>
    <dt>materia</dt><dd>Biología Celular, 2.º cuatrimestre 2026</dd>
    <dt>lugar</dt><dd>Escuela de Bio y Nanotecnologías, UNSAM</dd>
    <dt>trabajo</dt><dd>Esferoides HT22 · <span class="t-gfp">M6a-GFP</span></dd>
  </dl>
  </div>
  <div class="acc"><a class="btn ancho" href="./">[ ‹ volver al inicio ]</a></div>
</main>
<script>
// Para sumar datos de alguien: completá sus campos. foto, cv y linkedin son rutas o links
// (por ejemplo foto: 'img/integrantes/bonomo.jpg', cv: 'cv/bonomo.pdf').
const INTEGRANTES = [
  { nombre: 'Nahuel Bonomo',         foto: '', descripcion: 'Estudiante de Biotecnología en la UNSAM y pasante en el laboratorio de la UBA (FFyB), donde domina la síntesis de péptidos en fase sólida con una precisión casi de relojero. Organizado, de aprendizaje ultrarrápido y siempre listo para ayudar al equipo. Cuando cuelga el guardapolvo, lo que más disfruta es tocar la guitarra.', mail: 'nahuel7496@gmail.com', cv: 'cv/CV_Nahuel_Bonomo.pdf', linkedin: 'https://www.linkedin.com/in/nahuel-bonomo-918807351/' },
  { nombre: 'Bautista Fascetto',     foto: '', descripcion: 'Estudiante avanzado de Biotecnología en la UNSAM, ayudante de investigación en el IIB (UNSAM/CONICET) donde entrena una inteligencia artificial para cazar Trypanosoma cruzi en imágenes de microscopía, y ayudante de laboratorio en la UBA cultivando plantas in vitro. Ganador de una beca para la Autumn School de la Universidad de Potsdam, programa en R y Python, estudia alemán y, como si fuera poco, es quien construyó esta web de punta a punta. Cuando no está entre pipetas y código, se lo encuentra en el gimnasio.', mail: 'fascettob@gmail.com', cv: 'cv/CV_Bautista_Fascetto.pdf', linkedin: 'https://www.linkedin.com/in/bautistafascetto/' },
  { nombre: 'Mauro Lucero',          foto: '', descripcion: 'Técnico Químico y estudiante avanzado de Biotecnología, con más de un año y medio de experiencia en laboratorios microbiológicos y fisicoquímicos acreditados bajo ISO 17025. Entre cultivos, autoclaves y trazabilidad impecable, es el rigor del grupo. Le apasiona la lectura y devora libros con el mismo entusiasmo con que cuenta colonias.', mail: 'maurolucero03@gmail.com', cv: 'cv/CV_Mauro_Lucero.pdf', linkedin: 'https://www.linkedin.com/in/mauro-lucero-17bb2120b/' },
  { nombre: 'Donato Cavagnaro Rago', archivo: 'cavagnaro-rago', foto: '', descripcion: 'Estudiante de Biotecnología en la UNSAM y pasante de bioinformática en el IIB (UNSAM/CONICET), donde analiza datos de RNA-seq de célula única en R y Python con precisión quirúrgica. Voluntario y formador de jóvenes, organizado e independiente, además estudia alemán. Lo suyo es la resistencia: cuando sale del laboratorio, sale a correr.', mail: 'cavagnaroragodonato@gmail.com', cv: '', linkedin: 'https://www.linkedin.com/in/donato-cavagnaro-rago-320267276/' },
];
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iniciales = n => n.split(' ').slice(0, 2).map(p => p[0]).join('');
const lista = document.getElementById('gente');
INTEGRANTES.forEach((p, i) => {
  const foto = p.foto ? `<img class="foto" src="${esc(p.foto)}" alt="">` : `<span class="foto" aria-hidden="true">${iniciales(p.nombre)}</span>`;
  const archivo = p.archivo || p.nombre.split(' ').slice(-1)[0].toLowerCase();
  lista.insertAdjacentHTML('beforeend', `
    <details class="persona" name="gente">
      <summary class="fila-p">${foto}<b>${esc(p.nombre)}</b><span class="flecha" aria-hidden="true">›</span></summary>
      <div class="ficha">
        <p class="linea"><span class="pr">$</span> cat ${esc(archivo)}.txt</p>
        ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
        ${!(p.descripcion || p.mail || p.cv || p.linkedin) ? `<p class="dim">pronto: descripción, mail, CV y LinkedIn</p>` : ''}
        ${p.mail ? `<div class="mail"><span class="dim">mail</span><span class="dir">${esc(p.mail)}</span><button class="btn btn--chico copiar" type="button">[ copiar ]</button></div>` : ''}
        ${p.cv || p.linkedin ? `<div class="enlaces">
          ${p.cv ? `<a class="btn btn--chico" href="${esc(p.cv)}" target="_blank" rel="noopener">[ ver CV ]</a>` : ''}
          ${p.linkedin ? `<a class="btn btn--chico" href="${esc(p.linkedin)}" target="_blank" rel="noopener">[ LinkedIn ]</a>` : ''}
        </div>` : ''}
      </div>
    </details>`);
});
lista.addEventListener('click', e => {
  const b = e.target.closest('.copiar'); if (!b) return;
  const dir = b.previousElementSibling;
  const ok = () => { b.textContent = '[ copiado ]'; setTimeout(() => b.textContent = '[ copiar ]', 1500); };
  (navigator.clipboard ? navigator.clipboard.writeText(dir.textContent) : Promise.reject()).then(ok).catch(() => {
    const r = document.createRange(); r.selectNodeContents(dir); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
});
</script>
</body>
</html>
